<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; font-size: 13px; }
    .card { border: none; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .metric-val { font-size: 1.4rem; font-weight: 800; display: block; }
    .metric-label { font-size: 0.7rem; color: #666; font-weight: bold; }
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: white; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .val-danger { color: #dc3545 !important; }
    .val-success { color: #198754 !important; }
    .table-res { max-height: 350px; overflow-y: auto; }
  </style>
</head>
<body>

<div id="loader">
  <div class="spinner-border text-primary"></div>
  <span class="mt-2 fw-bold">Memuat Data Produksi...</span>
</div>

<div class="p-2 border-bottom bg-white sticky-top d-flex justify-content-between align-items-center">
  <b class="text-primary">DASHBOARD</b>
  <div class="d-flex gap-1">
    <input type="date" id="t1" class="form-control form-control-sm" style="width:115px">
    <input type="date" id="t2" class="form-control form-control-sm" style="width:115px">
    <button onclick="fetchData()" class="btn btn-primary btn-sm">OK</button>
  </div>
</div>

<div class="container-fluid p-2">
  <!-- Metric Row -->
  <div class="row g-2 mb-2 text-center">
    <div class="col-6 col-md-3">
      <div class="card p-2"><span class="metric-label">Giling (Kg)</span><span id="m-giling" class="metric-val">-</span></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2"><span class="metric-label">Downtime</span><span id="m-dt" class="metric-val text-danger">-</span></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2"><span class="metric-label">Eff. Thermo</span><span id="m-thermo" class="metric-val">-</span></div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2"><span class="metric-label">WIP Ratio</span><span id="m-wip" class="metric-val text-success">-</span></div>
    </div>
  </div>

  <div class="row g-2">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header bg-white d-flex justify-content-between py-2">
          <b>DETAIL THERMO</b>
          <span class="badge bg-danger">Min 40%</span>
        </div>
        <div class="table-res">
          <table class="table table-sm table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-2">Item/TF</th>
                <th class="text-end">Box</th>
                <th class="text-end">Kg</th>
                <th class="text-end pe-2">Eff%</th>
              </tr>
            </thead>
            <tbody id="tbody-thermo"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-header bg-white py-2"><b>LINE SHEET</b></div>
        <div class="list-group list-group-flush" id="list-line"></div>
      </div>
      
      <div class="card bg-dark text-white p-2">
        <div class="row text-center g-0">
          <div class="col-4 border-end border-secondary">
            <div id="q-sayat" class="fw-bold text-warning">0%</div><small style="font-size:9px">Sayat</small>
          </div>
          <div class="col-4 border-end border-secondary">
            <div id="q-sheet" class="fw-bold text-warning">0%</div><small style="font-size:9px">Sheet</small>
          </div>
          <div class="col-4">
            <div id="q-waste" class="fw-bold text-warning">0%</div><small style="font-size:9px">Waste</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  window.onload = function() {
    const d = new Date().toISOString().split('T')[0];
    document.getElementById('t1').value = d;
    document.getElementById('t2').value = d;
    fetchData();
  };

  function fetchData() {
    document.getElementById('loader').style.display = 'flex';
    const f = { startDate: document.getElementById('t1').value, endDate: document.getElementById('t2').value };
    
    google.script.run
      .withSuccessHandler(res => {
        document.getElementById('loader').style.display = 'none';
        render(res);
      })
      .withFailureHandler(err => {
        document.getElementById('loader').style.display = 'none';
        alert("CRITICAL ERROR: " + err.message);
      })
      .dpGetDashboardData(f);
  }

  function render(data) {
    // Math Summary
    let giling = data.giling.rows.reduce((a, b) => a + b.total, 0);
    document.getElementById('m-giling').innerText = Math.round(giling).toLocaleString('id-ID');
    document.getElementById('m-dt').innerText = data.tehnik.totalDowntime;
    document.getElementById('m-wip').innerText = data.wip.summary.pctWip.toFixed(1) + '%';
    
    const eth = data.thermo.summary;
    document.getElementById('m-thermo').innerText = eth.pct.toFixed(1) + '%';
    document.getElementById('m-thermo').className = 'metric-val ' + (eth.pct < 40 ? 'val-danger' : 'val-success');

    // Table Thermo
    let h = '';
    data.thermo.rows.forEach(r => {
      h += `<tr>
        <td class="ps-2"><b>${r.tf}</b></td>
        <td class="text-end">${Math.round(r.box)}</td>
        <td class="text-end text-primary">${Math.round(r.tonase)}</td>
        <td class="text-end pe-2 fw-bold ${r.pct < 40 ? 'val-danger' : 'val-success'}">${r.pct.toFixed(1)}%</td>
      </tr>`;
    });
    document.getElementById('tbody-thermo').innerHTML = h;

    // Line Sheet
    let l = '';
    data.totalSheet.rows.forEach(r => {
      l += `<div class="list-group-item d-flex justify-content-between py-1">
        <small>LINE ${r.ext}</small><b>${Math.round(r.total)}</b>
      </div>`;
    });
    document.getElementById('list-line').innerHTML = l;

    // Quality
    const q = data.extruder.summary;
    document.getElementById('q-sayat').innerText = q.pctBsSayat.toFixed(1) + '%';
    document.getElementById('q-sheet').innerText = q.pctBsSheet.toFixed(1) + '%';
    document.getElementById('q-waste').innerText = q.pctWaste.toFixed(1) + '%';
  }
</script>
</body>
</html>
